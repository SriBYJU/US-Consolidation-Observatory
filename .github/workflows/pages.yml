name: Build and deploy Observatory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Download and verify Census BDS source
        run: |
          curl -fsSL https://www2.census.gov/programs-surveys/bds/tables/time-series/2023/bds2023_st_sec.csv -o /tmp/bds2023_st_sec.csv
          echo "ba73f1ad58749d57f04c6bb56b0618c92384897a3e9f793de0df7b23f1f1868a  /tmp/bds2023_st_sec.csv" | sha256sum -c -
      - name: Rebuild full research/browser release
        env:
          BDS_SOURCE: /tmp/bds2023_st_sec.csv
        run: |
          python scripts/build_research_assets.py
          python scripts/run_score_sensitivity.py
          python scripts/build_advanced_diagnostics.py
          python scripts/build_site_bundle.py
      - name: Validate application and release
        run: |
          node --check assets/app-core.js
          node --check assets/app-ui.js
          node --check assets/app.js
          python scripts/validate_release.py
          python scripts/end_to_end_audit.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
