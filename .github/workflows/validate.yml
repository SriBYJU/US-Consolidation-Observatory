name: Build and validate research release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify official Census BDS source
        run: |
          curl -L --fail --retry 3 -o /tmp/bds2023_st_sec.csv \
            https://www2.census.gov/programs-surveys/bds/tables/time-series/2023/bds2023_st_sec.csv
          echo "ba73f1ad58749d57f04c6bb56b0618c92384897a3e9f793de0df7b23f1f1868a  /tmp/bds2023_st_sec.csv" | sha256sum -c -
      - name: Rebuild derived research assets from public source
        env:
          BDS_SOURCE: /tmp/bds2023_st_sec.csv
        run: |
          python scripts/build_research_assets.py
          python scripts/run_score_sensitivity.py
          python scripts/build_advanced_diagnostics.py
      - name: Validate JavaScript syntax
        run: node --check assets/app.js
      - name: Run 62-gate release audit
        run: python scripts/validate_release.py
