name: Finalize audited v0.3 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify official Census BDS source
        run: |
          curl -fsSL https://www2.census.gov/programs-surveys/bds/tables/time-series/2023/bds2023_st_sec.csv -o /tmp/bds2023_st_sec.csv
          echo "ba73f1ad58749d57f04c6bb56b0618c92384897a3e9f793de0df7b23f1f1868a  /tmp/bds2023_st_sec.csv" | sha256sum -c -
      - name: Rebuild research and self-contained viewer data
        env:
          BDS_SOURCE: /tmp/bds2023_st_sec.csv
        run: |
          python scripts/build_research_assets.py
          python scripts/run_score_sensitivity.py
          python scripts/build_advanced_diagnostics.py
          python scripts/build_site_bundle.py
      - name: Materialize supplied About portrait
        run: |
          base64 -d assets/shriyan-about.b64 > assets/shriyan-about.jpg
          test -s assets/shriyan-about.jpg
      - name: Validate application
        run: |
          node --check assets/app.js
          python scripts/validate_release.py
          python scripts/end_to_end_audit.py
      - name: Remove temporary staging
        run: |
          rm -rf bootstrap
          rm -f assets/about-photo-note.txt assets/shriyan-about.b64
          rm -f .github/workflows/apply-v03.yml
      - name: Commit clean final v0.3 release
        run: |
          git config user.name "SriBYJU"
          git config user.email "95580233+SriBYJU@users.noreply.github.com"
          git add index.html assets/app.js assets/styles.css assets/shriyan-about.jpg \
            scripts/build_site_bundle.py scripts/end_to_end_audit.py \
            data/site_data.json.gz data/site \
            .github/workflows/validate.yml .github/workflows/pages.yml
          git add -A bootstrap assets/about-photo-note.txt assets/shriyan-about.b64 .github/workflows/apply-v03.yml
          git commit -m "Release v0.3: public-data UX, viewer data, guide, and About portrait"
          git push origin main
